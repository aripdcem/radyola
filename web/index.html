<!DOCTYPE html>
<html lang="en" data-bs-theme="auto">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radyola</title>
    <meta name="description" content="A premium internet radio player with curated stations from around the world.">
    <!-- Paylaşım kartları mutlak adres ister; kanonik adres özel alan adı. -->
    <link rel="canonical" href="https://radyola.aripd.com/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Radyola">
    <meta property="og:title" content="Radyola">
    <meta property="og:description" content="A premium internet radio player with curated stations from around the world.">
    <meta property="og:url" content="https://radyola.aripd.com/">
    <meta property="og:image" content="https://radyola.aripd.com/icons/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Radyola">
    <meta name="twitter:description" content="A premium internet radio player with curated stations from around the world.">
    <meta name="twitter:image" content="https://radyola.aripd.com/icons/og-image.png">
    <meta name="theme-color" content="#0a0a1a">
    <link rel="icon" href="./radyola.svg">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-title" content="Radyola">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; background: #0a0a1a; overflow-x: hidden; }
    </style>
</head>

<body>
    <aripd-radyola></aripd-radyola>
    <script type="module" src="./dist/js/index.js"></script>
    <script>
        // Kayıt ana sayfanın işi, bileşenin değil: bileşen başka sitelere de
        // gömülebiliyor; oralarda SW dayatmak ev sahibinin kararını çiğnerdi.
        if ("serviceWorker" in navigator) {
            addEventListener("load", () => {
                navigator.serviceWorker.register("./sw.js").catch(() => { /* çevrimdışı ilk ziyaret vb. */ });
            });
        }
    </script>
</body>

</html>
