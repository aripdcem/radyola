# Bağımlılık güncellemeleri. Aylık: radyo çalar hızlı hareket eden bir yığın
# değil, haftalık PR akışı gürültü olur.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      androidx:
        patterns: ["androidx.*"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
