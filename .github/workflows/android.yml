# Android CI — her itmede test koşar ve indirilebilir APK üretir.
#
# APK'lar iş özetindeki "Artifacts" bölümünden inilir (30 gün saklanır).
# Sürüm etiketiyle (v1.2.3) yapılan yayınlar için `release.yml`'e bakın.
name: Android

on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - "data/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "data/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

# Aynı dala arka arkaya itme yapılırsa eski koşuyu iptal et.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test ve APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
        with:
          # versionCode commit sayısından türetiliyor; sığ klonda sayı yanlış çıkar.
          fetch-depth: 0

      - name: Gradle wrapper'ı doğrula
        uses: gradle/actions/wrapper-validation@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Koşucu imajı bunları zaten taşıyor; açıkça istemek imaj değişince
          # derlemenin sessizce bozulmasını engelliyor.
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Önbelleği yalnız ana dal yazsın; dal derlemeleri onu okur.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Sürüm numaralarını hesapla
        id: version
        run: |
          # Commit sayısı monoton artar ve CI koşu sayacından bağımsızdır:
          # aynı commit her zaman aynı versionCode'u verir.
          code=$(git rev-list --count HEAD)
          name="1.0.0-ci.${code}-$(git rev-parse --short HEAD)"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "APK sürümü: $name (versionCode $code)"

      - name: Birim testleri
        working-directory: android
        run: ./gradlew testDebugUnitTest

      - name: APK'ları derle
        working-directory: android
        run: >
          ./gradlew assembleDebug assembleRelease
          -Pradyola.versionCode=${{ steps.version.outputs.code }}
          -Pradyola.versionName=${{ steps.version.outputs.name }}

      - name: APK'ları topla
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "artifacts/radyola-${{ steps.version.outputs.name }}-debug.apk"
          cp android/app/build/outputs/apk/release/app-release.apk \
             "artifacts/radyola-${{ steps.version.outputs.name }}-release.apk"
          ls -lh artifacts/

      - name: APK'ları yükle
        uses: actions/upload-artifact@v4
        with:
          name: radyola-apk-${{ steps.version.outputs.name }}
          path: artifacts/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Test raporları (yalnız başarısızlıkta)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-raporlari-${{ github.run_number }}
          path: android/app/build/reports/tests/
          retention-days: 7
          if-no-files-found: ignore

      - name: Özet
        if: always()
        run: |
          {
            echo "### Radyola Android"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| versionName | \`${{ steps.version.outputs.name }}\` |"
            echo "| versionCode | \`${{ steps.version.outputs.code }}\` |"
            echo
            echo "APK'lar bu koşunun **Artifacts** bölümünde."
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint (bilgilendirme)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Lint bulguları derlemeyi düşürmesin; rapor artifact olarak inilir.
    # Bulgular temizlendikten sonra bu satır kaldırılıp zorunlu hâle getirilebilir.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Lint
        working-directory: android
        run: ./gradlew lintDebug

      - name: Lint raporu
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-raporu-${{ github.run_number }}
          path: android/app/build/reports/lint-results-debug.html
          retention-days: 14
          if-no-files-found: ignore
