image: node:22-alpine

# web/ veya data/ dizininde değişiklik olduğunda çalıştır
workflow:
  rules:
    - changes:
        - web/**/*
        - data/**/*
    - if: $CI_PIPELINE_SOURCE == "web"

stages:
  - build
  - deploy

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - web/node_modules/

build:
  stage: build
  script:
    - cd web
    - npm ci
    - npm run build
  artifacts:
    paths:
      - web/dist
      - web/index.html
      - web/radyola.svg
      - web/radyola-player.css
      - data/

pages:
  stage: deploy
  script:
    - mkdir -p public/data
    - cp web/index.html public/
    - cp web/radyola.svg public/
    - cp web/radyola-player.css public/
    - cp -r web/dist public/
    - cp data/*.json public/data/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
